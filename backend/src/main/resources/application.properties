# Server Configuration
server.port=${PORT:8080}

# MySQL Database Configuration (lokalt via Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db
spring.datasource.username=portfolio_user
spring.datasource.password=password123

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.amqp=INFO

# SendGrid Email Configuration
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:noreply@gustavnyberg.se}
sendgrid.from.name=${SENDGRID_FROM_NAME:Gustav Nyberg}
