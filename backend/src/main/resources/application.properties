# Server Configuration
server.port=${PORT:8080}

# MySQL Database Configuration (overrides med environment variables pa Render)
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db
spring.datasource.username=portfolio_user
spring.datasource.password=password123

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.amqp=DEBUG

# SendGrid Email Configuration
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:gustavnybergs@gmail.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:Gustav Nyberg}
